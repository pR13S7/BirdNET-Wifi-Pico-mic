<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="monospace" font-size="12">
  <title>INMP441 to ESP32-S3-N16R8 Wiring Diagram</title>

  <!-- Background -->
  <rect width="900" height="520" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">INMP441 I2S Microphone → ESP32-S3-N16R8</text>
  <text x="450" y="50" text-anchor="middle" fill="#888" font-size="11">Wiring Diagram — BirdNET WiFi Streaming (MicroPython)</text>

  <!-- INMP441 Board -->
  <rect x="60" y="120" width="200" height="280" fill="#2d2d44" stroke="#5555aa" stroke-width="2" rx="6"/>
  <text x="160" y="110" text-anchor="middle" fill="#aaaaff" font-size="14" font-weight="bold">INMP441</text>
  <text x="160" y="145" text-anchor="middle" fill="#888" font-size="10">I2S MEMS Microphone</text>

  <!-- INMP441 Mic hole -->
  <circle cx="160" cy="380" r="12" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="160" y="384" text-anchor="middle" fill="#666" font-size="8">MIC</text>
  <text x="160" y="410" text-anchor="middle" fill="#555" font-size="9">sound port (bottom)</text>

  <!-- INMP441 Pins (right side) -->
  <rect x="240" y="165" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="175" text-anchor="end" fill="#e0e0e0" font-size="11">VDD</text>

  <rect x="240" y="200" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="210" text-anchor="end" fill="#e0e0e0" font-size="11">GND</text>

  <rect x="240" y="235" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="245" text-anchor="end" fill="#e0e0e0" font-size="11">SD</text>

  <rect x="240" y="270" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="280" text-anchor="end" fill="#e0e0e0" font-size="11">SCK</text>

  <rect x="240" y="305" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="315" text-anchor="end" fill="#e0e0e0" font-size="11">WS</text>

  <rect x="240" y="340" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="350" text-anchor="end" fill="#e0e0e0" font-size="11">L/R</text>

  <!-- ESP32-S3 Board -->
  <rect x="580" y="90" width="260" height="380" fill="#2d3344" stroke="#5588aa" stroke-width="2" rx="6"/>
  <text x="710" y="80" text-anchor="middle" fill="#88ccff" font-size="14" font-weight="bold">ESP32-S3-N16R8</text>

  <!-- ESP32 USB port -->
  <rect x="685" y="90" width="50" height="15" fill="#555" stroke="#888" stroke-width="1" rx="3"/>
  <text x="710" y="100" text-anchor="middle" fill="#ccc" font-size="7">USB</text>

  <!-- ESP32 chip label -->
  <rect x="650" y="130" width="120" height="40" fill="#1a1a2e" stroke="#445566" stroke-width="1" rx="3"/>
  <text x="710" y="148" text-anchor="middle" fill="#5588aa" font-size="9">ESP32-S3</text>
  <text x="710" y="162" text-anchor="middle" fill="#445566" font-size="8">16MB + 8MB PSRAM</text>

  <!-- ESP32 Left pin column -->
  <!-- GPIO 4 -->
  <rect x="580" y="228" width="20" height="12" fill="#c8a415" rx="2"/>
  <text x="605" y="237" fill="#e0e0e0" font-size="9">GPIO 4</text>
  <text x="575" y="237" text-anchor="end" fill="#666" font-size="8">4</text>

  <!-- GPIO 5 -->
  <rect x="580" y="258" width="20" height="12" fill="#c8a415" rx="2"/>
  <text x="605" y="267" fill="#e0e0e0" font-size="9">GPIO 5</text>
  <text x="575" y="267" text-anchor="end" fill="#666" font-size="8">5</text>

  <!-- GPIO 6 -->
  <rect x="580" y="288" width="20" height="12" fill="#c8a415" rx="2"/>
  <text x="605" y="297" fill="#e0e0e0" font-size="9">GPIO 6</text>
  <text x="575" y="297" text-anchor="end" fill="#666" font-size="8">6</text>

  <!-- Right pin column -->
  <!-- 3V3 -->
  <rect x="820" y="178" width="20" height="12" fill="#c8a415" rx="2"/>
  <text x="815" y="187" text-anchor="end" fill="#e0e0e0" font-size="9">3V3</text>
  <text x="845" y="187" fill="#666" font-size="8">3V3</text>

  <!-- GND -->
  <rect x="820" y="198" width="20" height="12" fill="#333" rx="2"/>
  <text x="815" y="207" text-anchor="end" fill="#e0e0e0" font-size="9">GND</text>
  <text x="845" y="207" fill="#666" font-size="8">GND</text>

  <!-- GND left side for L/R -->
  <rect x="580" y="318" width="20" height="12" fill="#333" rx="2"/>
  <text x="605" y="327" fill="#e0e0e0" font-size="9">GND</text>
  <text x="575" y="327" text-anchor="end" fill="#666" font-size="8">G</text>

  <!-- Wires -->
  <!-- VDD (Red) -> 3V3 -->
  <path d="M 260 172 C 400 172, 500 184, 820 184" fill="none" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="440" y="165" fill="#ff4444" font-size="10" font-weight="bold">VDD → 3V3 (red)</text>

  <!-- GND (Black) -> GND -->
  <path d="M 260 207 C 400 207, 500 204, 820 204" fill="none" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
  <text x="440" y="220" fill="#999" font-size="10" font-weight="bold">GND → GND (black)</text>

  <!-- SCK (Blue) -> GPIO 4 -->
  <path d="M 260 277 C 380 277, 450 234, 580 234" fill="none" stroke="#4488ff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="420" y="255" fill="#4488ff" font-size="10" font-weight="bold">SCK → GPIO 4 (blue)</text>

  <!-- WS (Green) -> GPIO 5 -->
  <path d="M 260 312 C 380 312, 440 264, 580 264" fill="none" stroke="#44cc44" stroke-width="2.5" stroke-linecap="round"/>
  <text x="420" y="298" fill="#44cc44" font-size="10" font-weight="bold">WS → GPIO 5 (green)</text>

  <!-- SD (Yellow) -> GPIO 6 -->
  <path d="M 260 242 C 380 242, 450 294, 580 294" fill="none" stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round"/>
  <text x="420" y="335" fill="#ffcc00" font-size="10" font-weight="bold">SD → GPIO 6 (yellow)</text>

  <!-- L/R (Purple dashed) -> GND -->
  <path d="M 260 347 C 380 347, 450 324, 580 324" fill="none" stroke="#aa88cc" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,3"/>
  <text x="420" y="362" fill="#aa88cc" font-size="10">L/R → GND (left ch)</text>

  <!-- Legend -->
  <rect x="60" y="440" width="780" height="65" fill="#222233" stroke="#444" stroke-width="1" rx="4"/>
  <text x="80" y="460" fill="#e0e0e0" font-size="11" font-weight="bold">Pin Connections:</text>

  <line x1="80" y1="475" x2="100" y2="475" stroke="#ff4444" stroke-width="2.5"/>
  <text x="105" y="479" fill="#ccc" font-size="10">VDD → 3V3</text>

  <line x1="220" y1="475" x2="240" y2="475" stroke="#666" stroke-width="2.5"/>
  <text x="245" y="479" fill="#ccc" font-size="10">GND → GND</text>

  <line x1="360" y1="475" x2="380" y2="475" stroke="#4488ff" stroke-width="2.5"/>
  <text x="385" y="479" fill="#ccc" font-size="10">SCK → GPIO 4 (BCLK)</text>

  <line x1="560" y1="475" x2="580" y2="475" stroke="#44cc44" stroke-width="2.5"/>
  <text x="585" y="479" fill="#ccc" font-size="10">WS → GPIO 5 (LRCLK)</text>

  <line x1="80" y1="495" x2="100" y2="495" stroke="#ffcc00" stroke-width="2.5"/>
  <text x="105" y="499" fill="#ccc" font-size="10">SD → GPIO 6 (DATA)</text>

  <line x1="260" y1="495" x2="280" y2="495" stroke="#aa88cc" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="285" y="499" fill="#ccc" font-size="10">L/R → GND (selects left channel)</text>

  <text x="560" y="499" fill="#888" font-size="10">Note: Any GPIO works on ESP32-S3 (no pin constraints)</text>
</svg>
