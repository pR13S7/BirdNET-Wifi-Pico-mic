<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="monospace" font-size="12">
  <title>INMP441 to Raspberry Pi Pico 2W Wiring Diagram</title>

  <!-- Background -->
  <rect width="900" height="520" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">INMP441 I2S Microphone → Raspberry Pi Pico 2W</text>
  <text x="450" y="50" text-anchor="middle" fill="#888" font-size="11">Wiring Diagram — BirdNET WiFi Streaming</text>

  <!-- INMP441 Board -->
  <rect x="60" y="120" width="200" height="280" fill="#2d2d44" stroke="#5555aa" stroke-width="2" rx="6"/>
  <text x="160" y="110" text-anchor="middle" fill="#aaaaff" font-size="14" font-weight="bold">INMP441</text>
  <text x="160" y="145" text-anchor="middle" fill="#888" font-size="10">I2S MEMS Microphone</text>

  <!-- INMP441 Mic hole -->
  <circle cx="160" cy="380" r="12" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="160" y="384" text-anchor="middle" fill="#666" font-size="8">MIC</text>
  <text x="160" y="410" text-anchor="middle" fill="#555" font-size="9">⬇ sound port (bottom)</text>

  <!-- INMP441 Pins (right side) -->
  <rect x="240" y="165" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="175" text-anchor="end" fill="#e0e0e0" font-size="11">VDD</text>

  <rect x="240" y="200" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="210" text-anchor="end" fill="#e0e0e0" font-size="11">GND</text>

  <rect x="240" y="235" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="245" text-anchor="end" fill="#e0e0e0" font-size="11">SD</text>

  <rect x="240" y="270" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="280" text-anchor="end" fill="#e0e0e0" font-size="11">SCK</text>

  <rect x="240" y="305" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="315" text-anchor="end" fill="#e0e0e0" font-size="11">WS</text>

  <rect x="240" y="340" width="20" height="14" fill="#c8a415" rx="2"/>
  <text x="225" y="350" text-anchor="end" fill="#e0e0e0" font-size="11">L/R</text>

  <!-- Pico 2W Board -->
  <rect x="580" y="90" width="260" height="380" fill="#2d442d" stroke="#55aa55" stroke-width="2" rx="6"/>
  <text x="710" y="80" text-anchor="middle" fill="#aaffaa" font-size="14" font-weight="bold">Raspberry Pi Pico 2W</text>

  <!-- Pico USB port -->
  <rect x="685" y="90" width="50" height="15" fill="#555" stroke="#888" stroke-width="1" rx="3"/>
  <text x="710" y="100" text-anchor="middle" fill="#ccc" font-size="7">USB</text>

  <!-- Pico Left pin column (physical pins) -->
  <!-- Pin 21 - GP16 -->
  <rect x="580" y="268" width="20" height="12" fill="#c8a415" rx="2"/>
  <text x="605" y="277" fill="#e0e0e0" font-size="9">GP16</text>
  <text x="575" y="277" text-anchor="end" fill="#666" font-size="8">21</text>

  <!-- Pin 22 - GP17 -->
  <rect x="580" y="288" width="20" height="12" fill="#c8a415" rx="2"/>
  <text x="605" y="297" fill="#e0e0e0" font-size="9">GP17</text>
  <text x="575" y="297" text-anchor="end" fill="#666" font-size="8">22</text>

  <!-- Pin 23 - GND -->
  <rect x="580" y="308" width="20" height="12" fill="#333" rx="2"/>
  <text x="605" y="317" fill="#e0e0e0" font-size="9">GND</text>
  <text x="575" y="317" text-anchor="end" fill="#666" font-size="8">23</text>

  <!-- Pin 24 - GP18 -->
  <rect x="580" y="328" width="20" height="12" fill="#c8a415" rx="2"/>
  <text x="605" y="337" fill="#e0e0e0" font-size="9">GP18</text>
  <text x="575" y="337" text-anchor="end" fill="#666" font-size="8">24</text>

  <!-- Right pin column -->
  <!-- Pin 36 - 3V3 -->
  <rect x="820" y="178" width="20" height="12" fill="#c8a415" rx="2"/>
  <text x="815" y="187" text-anchor="end" fill="#e0e0e0" font-size="9">3V3(OUT)</text>
  <text x="845" y="187" fill="#666" font-size="8">36</text>

  <!-- Pin 38 - GND -->
  <rect x="820" y="198" width="20" height="12" fill="#333" rx="2"/>
  <text x="815" y="207" text-anchor="end" fill="#e0e0e0" font-size="9">GND</text>
  <text x="845" y="207" fill="#666" font-size="8">38</text>

  <!-- Wires -->
  <!-- VDD (Red) → 3V3 Pin 36 -->
  <path d="M 260 172 C 400 172, 500 184, 820 184" fill="none" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="440" y="165" fill="#ff4444" font-size="10" font-weight="bold">VDD → 3V3 (red)</text>

  <!-- GND (Black) → GND Pin 38 -->
  <path d="M 260 207 C 400 207, 500 204, 820 204" fill="none" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
  <text x="440" y="220" fill="#999" font-size="10" font-weight="bold">GND → GND (black)</text>

  <!-- SCK (Blue) → GP16 Pin 21 -->
  <path d="M 260 277 C 380 277, 450 274, 580 274" fill="none" stroke="#4488ff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="420" y="268" fill="#4488ff" font-size="10" font-weight="bold">SCK → GP16 (blue)</text>

  <!-- WS (Green) → GP17 Pin 22 -->
  <path d="M 260 312 C 380 312, 440 294, 580 294" fill="none" stroke="#44cc44" stroke-width="2.5" stroke-linecap="round"/>
  <text x="420" y="308" fill="#44cc44" font-size="10" font-weight="bold">WS → GP17 (green)</text>

  <!-- SD (Yellow) → GP18 Pin 24 -->
  <path d="M 260 242 C 380 242, 450 334, 580 334" fill="none" stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round"/>
  <text x="420" y="344" fill="#ffcc00" font-size="10" font-weight="bold">SD → GP18 (yellow)</text>

  <!-- L/R (Gray) → GND Pin 23 -->
  <path d="M 260 347 C 380 347, 450 314, 580 314" fill="none" stroke="#aa88cc" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,3"/>
  <text x="420" y="358" fill="#aa88cc" font-size="10">L/R → GND (left ch)</text>

  <!-- Legend -->
  <rect x="60" y="440" width="780" height="65" fill="#222233" stroke="#444" stroke-width="1" rx="4"/>
  <text x="80" y="460" fill="#e0e0e0" font-size="11" font-weight="bold">Pin Connections:</text>

  <line x1="80" y1="475" x2="100" y2="475" stroke="#ff4444" stroke-width="2.5"/>
  <text x="105" y="479" fill="#ccc" font-size="10">VDD → Pin 36 (3V3)</text>

  <line x1="240" y1="475" x2="260" y2="475" stroke="#666" stroke-width="2.5"/>
  <text x="265" y="479" fill="#ccc" font-size="10">GND → Pin 38 (GND)</text>

  <line x1="410" y1="475" x2="430" y2="475" stroke="#4488ff" stroke-width="2.5"/>
  <text x="435" y="479" fill="#ccc" font-size="10">SCK → Pin 21 (GP16)</text>

  <line x1="590" y1="475" x2="610" y2="475" stroke="#44cc44" stroke-width="2.5"/>
  <text x="615" y="479" fill="#ccc" font-size="10">WS → Pin 22 (GP17)</text>

  <line x1="80" y1="495" x2="100" y2="495" stroke="#ffcc00" stroke-width="2.5"/>
  <text x="105" y="499" fill="#ccc" font-size="10">SD → Pin 24 (GP18)</text>

  <line x1="240" y1="495" x2="260" y2="495" stroke="#aa88cc" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="265" y="499" fill="#ccc" font-size="10">L/R → Pin 23 (GND) — selects left channel</text>

  <text x="590" y="499" fill="#888" font-size="10">Note: WS pin must be SCK + 1 (MicroPython constraint)</text>
</svg>
